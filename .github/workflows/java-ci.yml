name: Java Compile Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile all Java files
        run: |
          find . -name "*.java" -print0 | xargs -0 javac

      - name: Done
        run: echo "All Java files compiled successfully!"